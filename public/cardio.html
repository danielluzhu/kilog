<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runs & Hikes</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <h1><a href="/index.html" class="app-icon-link" aria-label="Workout Log home"><img src="/android-chrome-192x192.png" alt="" class="app-icon" /></a> Workout Log</h1>
  <nav>
    <a href="/index.html">Log</a>
    <a href="/weekly.html">Weekly Routine</a>
    <a href="/dictionary.html">Exercise Dictionary</a>
    <a href="/lapse.html">Lapse</a>
    <a href="/volume.html">Volume</a>
    <a href="/onerm.html">1RM Calculator</a>
    <a href="/cardio.html" class="active">Runs & Hikes</a>
    <a href="/prilepin.html">Prilepin's Table</a>
    <a href="/snatch.html">The Snatch</a>
  </nav>
</header>

<main>
  <section class="card">
    <h2 style="margin-top:0">Log a run or hike</h2>
    <form id="add-form">
      <div class="row">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
        <div>
          <label for="activity">Activity</label>
          <select id="activity" required>
            <option value="run">Run</option>
            <option value="hike">Hike</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="distance-value">Distance</label>
          <input type="text" inputmode="decimal" id="distance-value" placeholder="e.g. 5.2" required />
        </div>
        <div>
          <label for="distance-unit">Unit</label>
          <select id="distance-unit">
            <option value="mi">mi</option>
            <option value="km">km</option>
          </select>
        </div>
        <div>
          <label for="duration">Duration</label>
          <input type="text" id="duration" placeholder="MM:SS or H:MM:SS" required />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="elevation-value">Elevation gain (optional)</label>
          <input type="text" inputmode="decimal" id="elevation-value" placeholder="e.g. 800" />
        </div>
        <div>
          <label for="elevation-unit">Unit</label>
          <select id="elevation-unit">
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>
        <div>
          <label for="notes">Notes (optional)</label>
          <input type="text" id="notes" placeholder="e.g. trail, humid" />
        </div>
      </div>

      <div class="status" id="add-status"></div>
      <div style="margin-top:0.75rem">
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </section>

  <section>
    <div class="toolbar">
      <h2 style="margin:0">History</h2>
      <input type="text" id="search" placeholder="Filter by activity, date, or notes..." />
      <span class="muted" id="count"></span>
    </div>
    <table>
      <thead>
        <tr><th>Date</th><th>Activity</th><th>Distance</th><th>Duration</th><th>Pace</th><th>Elevation</th><th>Notes</th><th></th></tr>
      </thead>
      <tbody id="cardio-body"></tbody>
    </table>
    <div style="margin-top:1rem; display:flex; gap:0.5rem;">
      <button id="load-more">Load more</button>
    </div>
  </section>
</main>

<script src="/utils.js"></script>
<script src="/cardio.js"></script>
</body>
</html>
