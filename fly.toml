app = "kilog"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Suspend rather than stop so the machine resumes in ~1s on the next request;
  # with min_machines_running = 0 an idle log costs nothing but the volume.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# SQLite tolerates exactly one writer. This app must never be scaled past a
# single machine — two machines on one volume is not possible on Fly, and two
# machines on two volumes would silently fork the log into divergent copies.
[mounts]
  source = "kilog_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
